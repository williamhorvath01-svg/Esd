<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Finder</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M12 20v-8"/><path d="M12 12c-2-2-6-6-6-8a6 6 0 0 1 12 0c0 2-4 6-6 8z"/></svg>
        Plant Finder
      </h1>
      <div class="header-controls">
        <div class="unit-toggle" role="group" aria-label="Unit system">
          <button id="btn-imperial" class="active" data-unit="imperial">Imperial</button>
          <button id="btn-metric" data-unit="metric">Metric</button>
        </div>
        <div class="export-group">
          <button class="btn btn-outline" id="btn-export-pdf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            PDF
          </button>
          <button class="btn btn-outline" id="btn-export-xlsx">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
            Spreadsheet
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <main class="app-main">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <!-- Location Panel -->
      <div class="location-panel">
        <h2>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Your Location
        </h2>
        <div class="location-input-group">
          <input type="text" id="location-input" placeholder="City, State or ZIP code" aria-label="Enter your location">
          <button id="location-btn">Look Up</button>
        </div>
        <div class="location-error" id="location-error"></div>
        <div class="location-results" id="location-results">
          <div class="location-stat">
            <div class="label">Hardiness Zone</div>
            <div class="value" id="loc-zone">--</div>
            <div class="detail" id="loc-zone-detail"></div>
          </div>
          <div class="location-stat">
            <div class="label">Biome</div>
            <div class="value" id="loc-biome">--</div>
          </div>
          <div class="location-stat">
            <div class="label">Chill Hours</div>
            <div class="value" id="loc-chill">--</div>
            <div class="detail" id="loc-chill-detail"></div>
          </div>
          <div class="location-stat">
            <div class="label">Growing Degree Days</div>
            <div class="value" id="loc-gdd">--</div>
            <div class="detail" id="loc-gdd-detail"></div>
          </div>
        </div>
      </div>

      <!-- Filter sections rendered dynamically -->
      <div id="filter-container"></div>

      <button class="btn btn-primary" id="clear-all-filters" style="margin-top:0.5rem;width:100%;">Clear All Filters</button>
    </aside>

    <!-- Content -->
    <section class="content-area">
      <div class="results-header">
        <div class="results-count" id="results-count">Loading plants...</div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search plants by name..." aria-label="Search plants">
        </div>
        <div class="view-toggle">
          <button id="view-grid" class="active" title="Grid view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
          <button id="view-list" title="List view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="plant-grid" id="plant-grid"></div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <!-- ===== Plant Detail Modal ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="plant-modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-cover" id="modal-cover"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/js/location.js"></script>
  <script src="/js/filters.js"></script>
  <script src="/js/plants.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
